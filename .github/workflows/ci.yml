name: MoonFriction checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify compiler and formatting
        run: |
          moon version --all
          sh scripts/check_moonc.sh
          moon fmt --check
      - name: Check, build and test
        run: |
          moon update
          sh scripts/build.sh
          moon test --target js
          moon run src/main --target js
          node scripts/test_host.mjs
          python scripts/test_embedding.py
      - name: Reference interoperability
        run: |
          python -m pip install -r scripts/requirements-reference.txt
          python scripts/test_reference.py
